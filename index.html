<html lang="en">

<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Sora,system-ui,-apple-system,"Segoe UI",sans-serif}

h2{font-size:16px;margin:26px 0 8px}
.sub{color:var(--muted);margin:2px 0 0}

button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row label{flex:1;cursor:pointer}

.row.done label{color:var(--muted);text-decoration:line-through}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 8px;border-radius:6px}
.x:hover{color:var(--ink)}
.add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.add input,.add select{padding:9px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:0}
.add input[type=text]{flex:1;min-width:140px}
.btn{padding:9px 16px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.timer{text-align:center;padding:22px 0 10px}
.time{font-size:68px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.mode{color:var(--muted);margin:6px 0 14px}
.timer .add{justify-content:center}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars b{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;margin-bottom:4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.col h3{font-size:14px;margin:0 0 6px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.item.d span{color:var(--muted);text-decoration:line-through}
.item .mv{display:flex;gap:2px;margin-top:4px}
.item .mv button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 8px;font-size:16px}
.empty{color:var(--muted);font-size:13px}
nav button{font-size:13.5px;padding:10px 2px}
textarea{width:100%;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:inherit;margin-top:8px}
details{border-bottom:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;font:inherit;color:var(--muted);margin:8px 0}
.chip.hot{color:var(--danger);border-color:var(--danger)}
.qq{font-size:20px;margin:6px 0 10px}
a{color:var(--accent)}
.hero{background:linear-gradient(135deg,var(--hero-start),var(--hero-end));color:var(--hero-ink);margin:-20px -16px 0;padding:26px 20px 44px;border-radius:0 0 28px 28px}

.hero .sub,.hero .stats{color:var(--hero-muted)}

nav{border:0;background:var(--surface);padding:5px;border-radius:18px;box-shadow:0 6px 20px rgba(45,52,44,.10);margin:-26px 4px 10px;position:relative;gap:2px}

h2{display:flex;align-items:center;gap:8px}

.qq::before{display:none}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row.done{background:color-mix(in srgb,var(--ok) 11%,var(--surface))}
.chip{padding:1px 9px;border:1px solid var(--c,var(--line));background:color-mix(in srgb,var(--c,transparent) 16%,transparent);color:var(--ink)}
.btn{border-radius:10px}.btn:active{transform:translateY(1px)}
.ringw{position:relative;width:220px;height:220px;margin:0 auto}
.ring{width:100%;height:100%}
.ring circle{fill:none;stroke-width:8}
.rt{stroke:var(--line)}
.rp{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .5s linear}
.ringw .time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px}
.col{background:color-mix(in srgb,var(--surface) 70%,transparent);padding:10px;border-radius:14px}
.cols .col:nth-child(1) h3{border-color:#687653}.cols .col:nth-child(2) h3{border-color:#AD8750}.cols .col:nth-child(3) h3{border-color:#638080}.cols .col:nth-child(4) h3{border-color:#678457}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
details details{border-radius:10px;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt{font-size:17px;padding:16px}
.fcq{display:block;font-size:26px;line-height:1.35;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px 18px;margin:10px 0}

.fca{font-size:24px;font-weight:700;text-align:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-radius:18px;padding:24px 16px;margin:6px 0 14px}
.btn.big{display:block;width:100%;font-size:20px;padding:18px;border-radius:16px}
.fcb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn.ok{background:var(--ok);color:var(--on-accent)}
.btn.no{background:var(--danger);color:var(--on-danger)}

.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.opt.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 15%,var(--surface))}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>

<section id="today"></section>
<section id="study" hidden></section>
<section id="board" hidden></section>
<section id="notes" hidden></section>
<section id="quiz" hidden></section>
</main>

async function restoreBackup(file){
 if(!file)return;
 try{
  if(file.size>20*1024*1024)throw new Error("Backup is too large (maximum 20 MB).");
  var parsed=JSON.parse(await file.text());
  if(parsed.format&&!(parsed.format==="daily-dashboard-backup"&&parsed.version===1))throw new Error("Unsupported backup format.");
  var next=parsed.format?parsed.data:parsed;
  if(!validState(next))throw new Error("This file is not a valid dashboard backup.");
  if(!confirm("Replace this browser's habits, notes, tasks and progress with this backup? Download a backup first if you want to keep the current data."))return;
  var nextRaw=JSON.stringify(next);
  // Write before changing the visible state. A failed write leaves it untouched.
  localStorage.setItem(KEY,nextRaw);savedRaw=nextRaw;lastGood=nextRaw;S=next;saveBlocked=false;freezePast();
  resetTimer();Q.st="setup";
  statusMessage("Backup restored successfully. Saved on this browser only.");
  $("reload-data").hidden=true;head();show("today");
 }catch(e){statusMessage("Restore failed. Current dashboard was not replaced. "+e.message)}
 finally{$("backup-file").value=""}
}
